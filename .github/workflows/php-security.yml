name: PHP security regression
on:
  push:
  pull_request:
jobs:
  jwt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: |
          find inc tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JWT security regression
        run: php tests/jwt-security.php
